# Baut NeoNote als Flatpak-Bündel (zum Testen als Artefakt herunterladbar).
# Für Releases baut der Workflow im Zweig „release“ dasselbe und hängt es an die Release an.
name: Flatpak
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - neonote.py
      - i18n/**
      - neonote.desktop
      - neonote.png
      - flatpak/**
      - .github/workflows/flatpak.yml
permissions:
  contents: write
jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.9
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: NeoNote-x86_64.flatpak
          manifest-path: flatpak/io.github.RembrandtZ4.NeoNote.yml
          cache-key: flatpak-builder-${{ hashFiles('flatpak/io.github.RembrandtZ4.NeoNote.yml') }}
      - name: Kurztest (Module laden, NeoNote ohne Bildschirm starten)
        continue-on-error: true
        run: |
          set -x
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
          flatpak install -y --user --noninteractive NeoNote-x86_64.flatpak
          flatpak run --command=python3 io.github.RembrandtZ4.NeoNote -c "import mpv, mutagen, jeepney; from PySide6 import QtCore, QtMultimedia; print('Module OK', QtCore.qVersion(), mpv.MPV)"
          QT_QPA_PLATFORM=offscreen NEONOTE_NOSPLASH=1 timeout 25 flatpak run --env=QT_QPA_PLATFORM=offscreen --env=NEONOTE_NOSPLASH=1 io.github.RembrandtZ4.NeoNote || true
          cat ~/.var/app/io.github.RembrandtZ4.NeoNote/data/neonote/startup.log || true
          cat ~/.var/app/io.github.RembrandtZ4.NeoNote/data/neonote/crash.log || true
      - name: Als Testversion zum Herunterladen bereitstellen (Vorabversion „test“)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || dnf install -y gh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp NeoNote-x86_64.flatpak NeoNote-test-x86_64.flatpak
          NOTES="Automatisch gebaute Testversion vom aktuellen Stand ($GITHUB_SHA). Keine offizielle Version – NeoNote bietet sie nicht als Update an. Installieren: flatpak install --user NeoNote-test-x86_64.flatpak"
          if ! gh release view test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create test --repo "$GITHUB_REPOSITORY" --prerelease --target main \
              --title "Testversion (Flatpak, aktueller Stand)" --notes "$NOTES"
          else
            gh release edit test --repo "$GITHUB_REPOSITORY" --prerelease --notes "$NOTES"
          fi
          gh release upload test NeoNote-test-x86_64.flatpak --repo "$GITHUB_REPOSITORY" --clobber
